version: '3.9'

services:
  scheduler-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler-node-1
    environment:
      SCHEDULER_NODE_ID: node-1
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: 50051
      SCHEDULER_GRPC_PORT: 50052
      SCHEDULER_METRICS_PORT: 9090
      SCHEDULER_LOG_LEVEL: debug
      SCHEDULER_CLUSTER_NODES: "node-1,node-2,node-3"
      SCHEDULER_PERSISTENCE_ENABLED: "true"
      SCHEDULER_DATA_DIR: /data/node-1
    ports:
      - "50051:50051"
      - "50052:50052"
      - "9090:9090"
    volumes:
      - node1_data:/data/node-1
      - ./scheduler/config:/app/config:ro
    networks:
      - scheduler_cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - scheduler-node-2
      - scheduler-node-3

  scheduler-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler-node-2
    environment:
      SCHEDULER_NODE_ID: node-2
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: 50051
      SCHEDULER_GRPC_PORT: 50052
      SCHEDULER_METRICS_PORT: 9090
      SCHEDULER_LOG_LEVEL: debug
      SCHEDULER_CLUSTER_NODES: "node-1,node-2,node-3"
      SCHEDULER_PERSISTENCE_ENABLED: "true"
      SCHEDULER_DATA_DIR: /data/node-2
    ports:
      - "50053:50051"
      - "50054:50052"
      - "9091:9090"
    volumes:
      - node2_data:/data/node-2
      - ./scheduler/config:/app/config:ro
    networks:
      - scheduler_cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  scheduler-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler-node-3
    environment:
      SCHEDULER_NODE_ID: node-3
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: 50051
      SCHEDULER_GRPC_PORT: 50052
      SCHEDULER_METRICS_PORT: 9090
      SCHEDULER_LOG_LEVEL: debug
      SCHEDULER_CLUSTER_NODES: "node-1,node-2,node-3"
      SCHEDULER_PERSISTENCE_ENABLED: "true"
      SCHEDULER_DATA_DIR: /data/node-3
    ports:
      - "50055:50051"
      - "50056:50052"
      - "9092:9090"
    volumes:
      - node3_data:/data/node-3
      - ./scheduler/config:/app/config:ro
    networks:
      - scheduler_cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9000:9090"
    networks:
      - scheduler_cluster
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  node1_data:
  node2_data:
  node3_data:
  prometheus_data:

networks:
  scheduler_cluster:
    driver: bridge
