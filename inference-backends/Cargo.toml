[package]
name = "inference-backends"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util.workspace = true
async-trait = "0.1"

# HTTP & API
reqwest = { version = "0.11", features = ["json"] }
hyper = "0.14"

# Serialization
serde = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging & Tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# UUID
uuid.workspace = true
chrono.workspace = true

# Utilities
lazy_static.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
rand.workspace = true

# Native inference (optional, see `native-llama` feature)
llama-cpp-2 = { workspace = true, optional = true }

[features]
default = []
# Enables the native llama.cpp FFI backend (llama_cpp_sys/llama_cpp_safe).
# Requires a working llama-cpp-2 build/link setup; off by default because
# Ollama covers local inference (see src/ollama.rs) without the native
# toolchain dependency.
native-llama = ["llama-cpp-2"]

# Testing
[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
