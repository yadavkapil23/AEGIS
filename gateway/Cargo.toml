[package]
name = "aegis-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.10"
prost = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
lru = "0.12"
parking_lot = "0.12"
thiserror = "1"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "gateway"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
